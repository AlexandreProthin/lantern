<!--
  id:        r002-03
  component: backdrop
  phase:     draft
  parents:   none (fresh start; a clean replacement for r001-01's blurred shapes)
  direction: Light veils: a few smooth translucent ribbons of light at different depths, far ones softer, each catching amber on its upper edge; no particles, no texture
  request:   revision 2
  inputs:    I do not like the noisy/dust texture effect. Make it clear/clean.
             not sure yet but by preference order:r001-02, r001-03,r001-01
             (clarified in chat: "noisy/dust texture" means the grain only; motes stay, sparse and crisp)
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backdrop r002-03 — Light veils</title>
<style>
  :root {
    --bg: #101827; --surface: #172132; --surface-2: #302b2a; --ink: #f3e9dc; --ink-mute: #aeb3bf;
    --line: #3b4558; --accent: #e8b66e; --accent-ink: #211b14; --focus: #ffe0ab; --node-lit: #ffe1aa;
    /* cool companion: deep teal, as in r001-01 */
    --cool: #3a8a8c; --cool-deep: #1f4a52;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 12px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #dither { pointer-events: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 75% at 50% 48%, transparent 55%, rgba(6, 9, 17, .4) 100%); }
  .tag { position: fixed; top: 14px; left: 16px; color: var(--ink-mute); opacity: .55; letter-spacing: .02em; pointer-events: none; }
  .ui { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
    padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: rgba(16, 24, 39, .62);
    backdrop-filter: blur(10px); max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center; }
  .ui button { font: inherit; color: var(--ink-mute); background: transparent; border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer; }
  .ui button:hover { color: var(--ink); }
  .ui button[aria-pressed="true"] { color: var(--node-lit); background: var(--surface-2); }
  .ui button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .seg { display: flex; gap: 2px; }
  .hint { color: var(--ink-mute); opacity: .6; padding: 0 10px 0 4px; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="dither" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="tag">r002-03 · Light veils — <span id="screenName">Welcome</span></div>
<div class="ui" id="ui">
  <div class="seg">
    <button data-s="welcome" aria-pressed="true">Welcome</button>
    <button data-s="graph" aria-pressed="false">Graph</button>
    <button data-s="gallery" aria-pressed="false">Gallery</button>
  </div>
  <button id="light">Light a node</button>
  <button id="speed" aria-pressed="false">Preview ×8</button>
  <span class="hint">drag pan · wheel zoom · click light · R reset</span>
</div>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sky = document.getElementById('sky'), sctx = sky.getContext('2d');
  const dither = document.getElementById('dither'), gctx = dither.getContext('2d');
  const veil = document.createElement('canvas'), vctx = veil.getContext('2d');   // veils only, transparent
  const DIV = 3;                                                                     // veils are soft: third resolution
  let W = 0, H = 0;

  const C = { amber: [232, 182, 110], cream: [255, 225, 170], glow: [255, 182, 88],
              teal: [58, 138, 140], tealDeep: [31, 74, 82], navy: [44, 60, 92] };

  // Five veils, far to near. depth drives softness (far = softer), parallax and zoom.
  const VEILS = [
    { c: 'tealDeep', edge: 'teal',  depth: .15, blur: 26, thick: .30, per: 88, ph: 0.4, freq: 1.1 },
    { c: 'navy',     edge: 'teal',  depth: .30, blur: 18, thick: .22, per: 71, ph: 2.0, freq: 1.4 },
    { c: 'teal',     edge: 'amber', depth: .50, blur: 10, thick: .10, per: 57, ph: 3.6, freq: 1.7 },
    { c: 'glow',     edge: 'cream', depth: .70, blur: 6,  thick: .05, per: 46, ph: 5.1, freq: 2.0 },
    { c: 'amber',    edge: 'cream', depth: 1.0, blur: 22, thick: .14, per: 64, ph: 1.2, freq: .9 }
  ];
  //  per veil: [y at left, y at right, wave amplitude, alpha]  (fractions of height)
  const PRESETS = {
    welcome: { gain: 1,   halo: .16, veils: [[.30, .70, .10, .55], [.72, .38, .08, .45], [.62, .50, .06, .16], [.58, .52, .05, .22], [.95, .78, .07, .06]] },
    graph:   { gain: .55, halo: .05, veils: [[.08, .18, .05, .50], [.92, .86, .04, .40], [.96, .90, .03, .10], [.06, .10, .03, .10], [1.1, 1.05, .03, .0]] },
    gallery: { gain: .8,  halo: .10, veils: [[.20, .24, .04, .50], [.52, .48, .03, .40], [.34, .30, .03, .12], [.12, .16, .03, .16], [.98, .96, .04, .05]] }
  };
  const S = { screen: 'welcome', speed: 1, t: 0, panX: 0, panY: 0, zoom: 1, sPanX: 0, sPanY: 0, sZoom: 1,
              px: .5, py: .5, spx: .5, spy: .5, events: [] };
  const P = JSON.parse(JSON.stringify(PRESETS.welcome));

  const tile = document.createElement('canvas'); tile.width = tile.height = 180;
  (() => {
    const tc = tile.getContext('2d'), img = tc.createImageData(180, 180);
    for (let i = 0; i < img.data.length; i += 4) {
      const c = Math.random() > .5 ? 255 : 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = c;
      img.data[i + 3] = 2;   // ~1% : breaks up 8-bit banding in the dark gradients, not visible as texture
    }
    tc.putImageData(img, 0, 0);
  })();
  const pattern = gctx.createPattern(tile, 'repeat');
  function resize() {
    W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
    sky.width = veil.width = Math.ceil(W / DIV); sky.height = veil.height = Math.ceil(H / DIV);
    dither.width = W; dither.height = H; gctx.fillStyle = pattern; gctx.fillRect(0, 0, W, H);
  }
  addEventListener('resize', resize); resize();

  // ---- input (prototype stand-ins for the app's signals) ----
  let drag = null;
  addEventListener('pointerdown', e => { if (e.target.closest('.ui')) return; drag = { x: e.clientX, y: e.clientY, moved: 0 }; });
  addEventListener('pointermove', e => {
    S.px = e.clientX / W; S.py = e.clientY / H;
    if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      S.panX += dx; S.panY += dy; drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY; }
  });
  addEventListener('pointerup', e => { if (drag && drag.moved < 5 && !e.target.closest('.ui')) light(e.clientX, e.clientY); drag = null; });
  addEventListener('wheel', e => { S.zoom = Math.min(2.5, Math.max(.5, S.zoom * Math.exp(-e.deltaY * .0012))); }, { passive: true });
  addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') { S.panX = S.panY = 0; S.zoom = 1; }
    if (e.key >= '1' && e.key <= '3') setScreen(['welcome', 'graph', 'gallery'][e.key - 1]);
  });
  function light(x, y) { S.events.push({ x, y, t0: performance.now() / 1000 }); }
  document.getElementById('light').onclick = () => light(W * (.25 + Math.random() * .5), H * (.3 + Math.random() * .4));
  const speedBtn = document.getElementById('speed');
  speedBtn.onclick = () => { S.speed = S.speed === 1 ? 8 : 1; speedBtn.setAttribute('aria-pressed', S.speed > 1); };
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => setScreen(b.dataset.s));
  function setScreen(s) {
    S.screen = s; S.panX = S.panY = 0; S.zoom = 1;
    document.querySelectorAll('[data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s));
    document.getElementById('screenName').textContent = s[0].toUpperCase() + s.slice(1);
    if (reduce) Object.assign(P, JSON.parse(JSON.stringify(PRESETS[s])));
  }

  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, a)})`;
  const smooth = x => x * x * (3 - 2 * x);
  function envelope(age) {
    if (reduce) return age < 2 ? 1 : 0;
    if (age < .8) return smooth(age / .8);
    return Math.max(0, 1 - (age - .8) / 4);
  }

  let last = performance.now();
  function frame(now) {
    if (innerWidth && innerHeight && (innerWidth !== W || innerHeight !== H)) resize();
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!reduce) S.t += dt * S.speed;
    const kv = 1 - Math.exp(-dt * 2.2);
    S.sPanX += (S.panX - S.sPanX) * kv; S.sPanY += (S.panY - S.sPanY) * kv; S.sZoom += (S.zoom - S.sZoom) * kv;
    if (!reduce) { const kp = 1 - Math.exp(-dt * .9); S.spx += (S.px - S.spx) * kp; S.spy += (S.py - S.spy) * kp; }
    const T = PRESETS[S.screen], kc = 1 - Math.exp(-dt * .8 * (S.speed > 1 ? 3 : 1));
    P.gain += (T.gain - P.gain) * kc; P.halo += (T.halo - P.halo) * kc;
    P.veils.forEach((v, i) => { for (let j = 0; j < 4; j++) v[j] += (T.veils[i][j] - v[j]) * kc; });

    const w = sky.width, h = sky.height, d = DIV, t = S.t;
    // sky: plain navy with one wide warm halo low behind the centre
    sctx.filter = 'none'; sctx.globalCompositeOperation = 'source-over';
    sctx.fillStyle = '#101827'; sctx.fillRect(0, 0, w, h);
    const hx = (.5 + .03 * Math.sin(t * 6.28 / 80)) * w, hy = .55 * h;
    let g = sctx.createRadialGradient(hx, hy, 0, hx, hy, .55 * w);
    g.addColorStop(0, rgba(C.glow, P.halo * P.gain)); g.addColorStop(1, rgba(C.glow, 0));
    sctx.fillStyle = g; sctx.fillRect(0, 0, w, h);

    // veils
    vctx.clearRect(0, 0, w, h);
    const ptrX = S.spx * W, ptrY = S.spy * H;
    VEILS.forEach((V, i) => {
      const [yl, yr, amp, alpha] = P.veils[i]; const a = alpha * P.gain; if (a < .004) return;
      const z = 1 + (S.sZoom - 1) * .25 * V.depth;
      const offX = S.sPanX * .12 * V.depth - (S.spx - .5) * W * .03 * V.depth;
      const offY = S.sPanY * .12 * V.depth - (S.spy - .5) * H * .03 * V.depth;
      const phase = t * 6.28 / V.per + V.ph, N = 48, top = [], bot = [];
      for (let k = 0; k <= N; k++) {
        const u = k / N, X = -.1 * W + u * 1.2 * W;
        let y = (yl + (yr - yl) * u) * H + amp * H * (Math.sin(u * V.freq * 6.28 + phase) * .7 + Math.sin(u * V.freq * 2.3 * 6.28 - phase * .6) * .3);
        // the pointer lifts the veil a little where it passes, like a breath under cloth
        const px = (X + offX - ptrX) / (W * .14);
        y -= (reduce ? 0 : 1) * H * .018 * V.depth * Math.exp(-px * px) * Math.exp(-(((y + offY - ptrY) / (H * .3)) ** 2));
        const th = V.thick * H * (.65 + .35 * Math.sin(u * 3.1 + phase * .8)) / 2;
        let x2 = W / 2 + (X + offX - W / 2) * z, y2 = H / 2 + (y + offY - H / 2) * z;
        top.push([x2 / d, (y2 - th * z) / d]); bot.push([x2 / d, (y2 + th * z) / d]);
      }
      vctx.save(); vctx.filter = `blur(${Math.max(1, V.blur / d * 1.5)}px)`;
      // body: fades from the lit upper edge down into the dark
      const ys = top.map(p => p[1]), minY = Math.min(...ys), maxY = Math.max(...bot.map(p => p[1]));
      const lg = vctx.createLinearGradient(0, minY, 0, maxY);
      lg.addColorStop(0, rgba(C[V.edge], a * .9)); lg.addColorStop(.25, rgba(C[V.c], a * .7)); lg.addColorStop(1, rgba(C[V.c], 0));
      vctx.fillStyle = lg; vctx.beginPath(); vctx.moveTo(top[0][0], top[0][1]);
      top.forEach(p => vctx.lineTo(p[0], p[1])); for (let k = bot.length - 1; k >= 0; k--) vctx.lineTo(bot[k][0], bot[k][1]);
      vctx.closePath(); vctx.fill();
      // lit edge: one clean line of light along the top
      vctx.filter = `blur(${Math.max(.6, V.blur / d * .35)}px)`;
      vctx.strokeStyle = rgba(C[V.edge], Math.min(1, a * 1.1)); vctx.lineWidth = Math.max(.6, 1.6 / d * 2);
      vctx.beginPath(); top.forEach((p, k) => k ? vctx.lineTo(p[0], p[1]) : vctx.moveTo(p[0], p[1])); vctx.stroke();
      vctx.restore();
    });
    // lit nodes: light runs along the veils near the node, the empty sky stays dark
    const nowS = now / 1000;
    S.events = S.events.filter(ev => nowS - ev.t0 < 5);
    if (S.events.length) {
      vctx.save(); vctx.globalCompositeOperation = 'source-atop';
      S.events.forEach(ev => {
        const e = envelope(nowS - ev.t0); if (!e) return;
        const r = W * (.12 + .22 * (reduce ? 1 : Math.min(1, (nowS - ev.t0) / 3)));
        const rg = vctx.createRadialGradient(ev.x / d, ev.y / d, 0, ev.x / d, ev.y / d, r / d);
        rg.addColorStop(0, rgba(C.cream, .9 * e)); rg.addColorStop(1, rgba(C.glow, 0));
        vctx.fillStyle = rg; vctx.fillRect(0, 0, w, h);
      });
      vctx.restore();
      S.events.forEach(ev => {                        // and a small soft glow at the node itself
        const e = envelope(nowS - ev.t0); if (!e) return;
        const rg = sctx.createRadialGradient(ev.x / d, ev.y / d, 0, ev.x / d, ev.y / d, W * .08 / d);
        rg.addColorStop(0, rgba(C.glow, .12 * e)); rg.addColorStop(1, rgba(C.glow, 0));
        sctx.fillStyle = rg; sctx.fillRect(0, 0, w, h);
      });
    }
    sctx.globalCompositeOperation = 'screen'; sctx.drawImage(veil, 0, 0); sctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
