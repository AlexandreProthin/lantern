<!--
  id:        r001-01
  component: backdrop
  phase:     draft
  parents:   none
  direction: Fog light: large blurred amber and teal light shapes drifting far back, under a fine film grain and a vignette
  request:   revision 1
  inputs:    Add texture/depth to the background of Welcome, Graph view and Gallery. Empty canvas, no app elements. Shared base tuned per screen (Welcome/Graph/Gallery switcher). Very slow drift (30-90 s cycles) with subtle reactions: pointer, graph pan/zoom, learning events, screen changes. Round 1: 3 layered mixes of blurred light shapes, grain & atmosphere, dust/motes, subtle pattern. Palette: existing navy/amber tokens plus one muted cool companion.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backdrop r001-01 — Fog light</title>
<style>
  :root {
    --bg: #101827; --surface: #172132; --surface-2: #302b2a; --ink: #f3e9dc; --ink-mute: #aeb3bf;
    --line: #3b4558; --accent: #e8b66e; --accent-ink: #211b14; --focus: #ffe0ab; --node-lit: #ffe1aa;
    /* cool companion proposed here: muted deep teal */
    --cool: #3a8a8c; --cool-deep: #1f4a52;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 12px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #grain { pointer-events: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 45%, rgba(6, 9, 17, .62) 100%); }
  .tag { position: fixed; top: 14px; left: 16px; color: var(--ink-mute); opacity: .55; letter-spacing: .02em; pointer-events: none; }
  .ui { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
    padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: rgba(16, 24, 39, .62);
    backdrop-filter: blur(10px); max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center; }
  .ui button { font: inherit; color: var(--ink-mute); background: transparent; border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer; }
  .ui button:hover { color: var(--ink); }
  .ui button[aria-pressed="true"] { color: var(--node-lit); background: var(--surface-2); }
  .ui button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .seg { display: flex; gap: 2px; }
  .hint { color: var(--ink-mute); opacity: .6; padding: 0 10px 0 4px; }
</style>
</head>
<body>
<canvas id="fog" aria-hidden="true"></canvas>
<canvas id="grain" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="tag">r001-01 · Fog light — <span id="screenName">Welcome</span></div>
<div class="ui" id="ui">
  <div class="seg">
    <button data-s="welcome" aria-pressed="true">Welcome</button>
    <button data-s="graph" aria-pressed="false">Graph</button>
    <button data-s="gallery" aria-pressed="false">Gallery</button>
  </div>
  <button id="light">Light a node</button>
  <button id="speed" aria-pressed="false">Preview ×8</button>
  <span class="hint">drag pan · wheel zoom · click light · R reset</span>
</div>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fog = document.getElementById('fog'), fctx = fog.getContext('2d');
  const grain = document.getElementById('grain'), gctx = grain.getContext('2d');
  const FOG_DIV = 4;           // fog is rendered at quarter resolution, it is all soft gradients
  let W = 0, H = 0;

  const C = {
    amber: [232, 182, 110], cream: [255, 225, 170], glow: [255, 182, 88],
    teal: [58, 138, 140], tealDeep: [31, 74, 82], navy: [44, 60, 92]
  };

  // Six shapes. Each screen gives every shape a place, size and strength; switching screens lets them travel there.
  const BLOBS = [
    { c: 'amber',    depth: .9, per: 52, ph: 0.0, amp: [.05, .04] },
    { c: 'teal',     depth: .4, per: 83, ph: 1.7, amp: [.07, .05] },
    { c: 'tealDeep', depth: .3, per: 71, ph: 3.1, amp: [.06, .06] },
    { c: 'cream',    depth: 1., per: 38, ph: 4.4, amp: [.03, .025] },
    { c: 'glow',     depth: .7, per: 64, ph: 2.2, amp: [.06, .05] },
    { c: 'navy',     depth: .2, per: 90, ph: 5.3, amp: [.05, .05] }
  ];
  //            x    y    r    a     (r in fraction of width)
  const PRESETS = {
    welcome: { gain: 1.0, grain: .9, blobs: [
      [.50, .44, .34, .26], [.14, .18, .46, .20], [.86, .86, .42, .26],
      [.54, .40, .14, .10], [.24, .82, .30, .10], [.82, .14, .36, .55]] },
    graph: { gain: .62, grain: .7, blobs: [
      [.92, .08, .26, .12], [.06, .88, .52, .16], [.80, .92, .40, .22],
      [.95, .05, .08, .04], [.10, .10, .24, .05], [.45, .50, .60, .45]] },
    gallery: { gain: .85, grain: .85, blobs: [
      [.30, .06, .40, .18], [.76, .02, .46, .18], [.50, 1.0, .55, .24],
      [.42, .02, .12, .06], [.62, .10, .26, .08], [.50, .55, .70, .45]] }
  };

  const S = { screen: 'welcome', speed: 1, t: 0, panX: 0, panY: 0, zoom: 1, sPanX: 0, sPanY: 0, sZoom: 1,
              px: .5, py: .5, spx: .5, spy: .5, events: [] };
  const P = JSON.parse(JSON.stringify(PRESETS.welcome));

  // grain tile: transparent with sparse white/black flecks
  const tile = document.createElement('canvas'); tile.width = tile.height = 180;
  (() => {
    const tc = tile.getContext('2d'), img = tc.createImageData(180, 180);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random(), c = v > .5 ? 255 : 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = c;
      img.data[i + 3] = Math.abs(v - .5) * 2 * 24;
    }
    tc.putImageData(img, 0, 0);
  })();
  const pattern = gctx.createPattern(tile, 'repeat');

  function resize() {
    W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
    fog.width = Math.ceil(W / FOG_DIV); fog.height = Math.ceil(H / FOG_DIV);
    grain.width = W; grain.height = H;
    drawGrain();
  }
  function drawGrain() {
    gctx.clearRect(0, 0, W, H);
    gctx.save(); gctx.translate(-Math.random() * 180, -Math.random() * 180);
    gctx.fillStyle = pattern; gctx.fillRect(0, 0, W + 180, H + 180); gctx.restore();
  }
  addEventListener('resize', resize); resize();

  // ---- input (prototype stand-ins for the app's signals) ----
  let drag = null;
  addEventListener('pointerdown', e => { if (e.target.closest('.ui')) return; drag = { x: e.clientX, y: e.clientY, moved: 0 }; });
  addEventListener('pointermove', e => {
    S.px = e.clientX / W; S.py = e.clientY / H;
    if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      S.panX += dx; S.panY += dy; drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY; }
  });
  addEventListener('pointerup', e => { if (drag && drag.moved < 5 && !e.target.closest('.ui')) light(e.clientX, e.clientY); drag = null; });
  addEventListener('wheel', e => { S.zoom = Math.min(2.5, Math.max(.5, S.zoom * Math.exp(-e.deltaY * .0012))); }, { passive: true });
  addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') { S.panX = S.panY = 0; S.zoom = 1; }
    if (e.key >= '1' && e.key <= '3') setScreen(['welcome', 'graph', 'gallery'][e.key - 1]);
  });
  function light(x, y) { S.events.push({ x, y, t0: performance.now() / 1000 }); }
  document.getElementById('light').onclick = () => light(W * (.25 + Math.random() * .5), H * (.25 + Math.random() * .5));
  const speedBtn = document.getElementById('speed');
  speedBtn.onclick = () => { S.speed = S.speed === 1 ? 8 : 1; speedBtn.setAttribute('aria-pressed', S.speed > 1); };
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => setScreen(b.dataset.s));
  function setScreen(s) {
    S.screen = s; S.panX = S.panY = 0; S.zoom = 1;
    document.querySelectorAll('[data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s));
    document.getElementById('screenName').textContent = s[0].toUpperCase() + s.slice(1);
    if (reduce) Object.assign(P, JSON.parse(JSON.stringify(PRESETS[s])));
  }

  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, a)})`;
  const smooth = x => x * x * (3 - 2 * x);
  function envelope(age) {
    if (reduce) return age < 2 ? 1 : 0;
    if (age < .9) return smooth(age / .9);
    return Math.max(0, 1 - (age - .9) / 4.2);
  }

  let last = performance.now(), grainClock = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!reduce) S.t += dt * S.speed;
    const kv = 1 - Math.exp(-dt * 2.2);              // view smoothing: the backdrop lags a little, which reads as depth
    S.sPanX += (S.panX - S.sPanX) * kv; S.sPanY += (S.panY - S.sPanY) * kv; S.sZoom += (S.zoom - S.sZoom) * kv;
    if (!reduce) { const kp = 1 - Math.exp(-dt * .9); S.spx += (S.px - S.spx) * kp; S.spy += (S.py - S.spy) * kp; }
    // screen recomposition: the shapes glide to their new places over ~3 s
    const T = PRESETS[S.screen], kc = 1 - Math.exp(-dt * .85 * (S.speed > 1 ? 3 : 1));
    P.gain += (T.gain - P.gain) * kc; P.grain += (T.grain - P.grain) * kc;
    P.blobs.forEach((b, i) => { for (let j = 0; j < 4; j++) b[j] += (T.blobs[i][j] - b[j]) * kc; });

    const fw = fog.width, fh = fog.height, d = FOG_DIV;
    fctx.globalCompositeOperation = 'source-over';
    fctx.fillStyle = '#101827'; fctx.fillRect(0, 0, fw, fh);
    fctx.globalCompositeOperation = 'screen';
    BLOBS.forEach((B, i) => {
      const [bx, by, br, ba] = P.blobs[i];
      const w = 2 * Math.PI * S.t / B.per + B.ph;
      let x = (bx + B.amp[0] * Math.sin(w)) * W, y = (by + B.amp[1] * Math.cos(w * .77 + 1)) * H;
      // depth: pointer parallax, graph pan and zoom move near shapes more than far ones
      const z = 1 + (S.sZoom - 1) * .12 * B.depth;
      x = W / 2 + (x - W / 2) * z + S.sPanX * .07 * B.depth - (S.spx - .5) * W * .025 * B.depth;
      y = H / 2 + (y - H / 2) * z + S.sPanY * .07 * B.depth - (S.spy - .5) * H * .025 * B.depth;
      const r = br * W * z * (1 + .08 * Math.sin(w * 1.3 + 2)), a = ba * P.gain;
      const g = fctx.createRadialGradient(x / d, y / d, 0, x / d, y / d, r / d);
      g.addColorStop(0, rgba(C[B.c], a)); g.addColorStop(.45, rgba(C[B.c], a * .5)); g.addColorStop(1, rgba(C[B.c], 0));
      fctx.fillStyle = g; fctx.fillRect(0, 0, fw, fh);
    });
    // learning events: a warm bloom where a node lit up
    const nowS = now / 1000;
    S.events = S.events.filter(ev => nowS - ev.t0 < 5.6);
    S.events.forEach(ev => {
      const e = envelope(nowS - ev.t0); if (!e) return;
      const r = W * (.07 + .13 * (reduce ? 1 : Math.min(1, (nowS - ev.t0) / 2.5)));
      const g = fctx.createRadialGradient(ev.x / d, ev.y / d, 0, ev.x / d, ev.y / d, r / d);
      g.addColorStop(0, rgba(C.cream, .16 * e)); g.addColorStop(.3, rgba(C.glow, .14 * e)); g.addColorStop(1, rgba(C.glow, 0));
      fctx.fillStyle = g; fctx.fillRect(0, 0, fw, fh);
    });

    grain.style.opacity = P.grain;
    grainClock += dt;
    if (!reduce && grainClock > .085) { grainClock = 0; drawGrain(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
