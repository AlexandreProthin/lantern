  inputs:    go motion
  shared:    ../assets/gallery-kit.js, ../assets/form-structure.js (structure), ../assets/color-base.js (tokens, type, form),

             ../assets/backdrop.js, ../choose-gallery-data.js. The CSS block is r003-01's, unchanged.

<!doctype html>
<html lang="en" data-room="choose">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose gallery r004-03 — Lantern light</title>
</head>
<body>
<script src="../choose-gallery-data.js"></script>
<script src="../assets/gallery-kit.js"></script>
<script src="../assets/form-structure.js"></script>
<script src="../assets/color-base.js"></script>
<script src="../assets/gallery-motion.js"></script>
<script>
const M = GALLERY_MOTION;
// the learning node's constants (learningnode RECIPE via welcome RECIPE): one canvas, travel, trail, embers, fan
const L = { speed: 1250, min: 160, max: 650, trailEvery: 22, trailMax: 34, drift: 26, life: [610, 690], fan: 16, spread: 1.4 * Math.PI, v: [28, 66] };
const cv = document.createElement('canvas'); cv.className = 'lightlayer'; cv.setAttribute('aria-hidden', 'true'); queueMicrotask(() => document.body.appendChild(cv));   // after the kit has built the page
const st = document.createElement('style'); st.textContent = '.lightlayer { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; } html.reduce .lightlayer { display: none; } @media (prefers-reduced-motion: reduce) { .lightlayer { display: none; } }'; document.head.appendChild(st);
const g = cv.getContext('2d'), DPR = Math.min(2, devicePixelRatio || 1);
const fit = () => { cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; }; fit(); addEventListener('resize', fit);
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { lit: tok('--node-lit'), accent: tok('--accent') };
const parts = [], dots = [];
let raf = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
function ember(x, y, vx, vy) { parts.push({ x, y, vx, vy, t: 0, life: rnd(...L.life) }); if (parts.length > 400) parts.shift(); kick(); }
function fan(x, y, n = L.fan, dir = -Math.PI / 2) { for (let i = 0; i < n; i++) { const a = dir - L.spread / 2 + L.spread * (i / (n - 1)), v = rnd(...L.v); ember(x, y, Math.cos(a) * v, Math.sin(a) * v); } }
// run a light along a polyline of viewport points; then() fires on arrival (timer-driven, never waits on frames)
function run(pts, then) {
  if (M.reduced()) { then && then(); return 0; }
  let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const dur = Math.max(L.min, Math.min(L.max, len / L.speed * 1000));
  dots.push({ pts, len, dur, t0: performance.now(), lastTrail: 0, trail: 0 }); kick();
  if (then) setTimeout(then, dur + 40);
  return dur;
}
function at(d, f) { let goal = f * d.len; for (let i = 1; i < d.pts.length; i++) { const [ax, ay] = d.pts[i - 1], [bx, by] = d.pts[i], s = Math.hypot(bx - ax, by - ay); if (goal <= s || i === d.pts.length - 1) { const k = s ? Math.min(1, goal / s) : 1; return [ax + (bx - ax) * k, ay + (by - ay) * k]; } goal -= s; } return d.pts[0]; }
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last) / 1000; last = now;
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = dots.length - 1; i >= 0; i--) {
    const d = dots[i], f = Math.min(1, (now - d.t0) / d.dur), [x, y] = at(d, f);
    if (now - d.lastTrail > L.trailEvery && d.trail < L.trailMax) { d.lastTrail = now; d.trail++; ember(x, y, rnd(-L.drift, L.drift), rnd(-L.drift, L.drift)); }
    g.save(); g.shadowColor = C.accent; g.shadowBlur = 12; g.fillStyle = C.lit; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); g.restore();
    if (f >= 1) { dots.splice(i, 1); if (d.fan) fan(x, y, d.fan); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt * 1000; if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; const a = 1 - p.t / p.life;
    g.globalAlpha = a; g.fillStyle = p.t / p.life < .4 ? C.lit : C.accent; g.beginPath(); g.arc(p.x, p.y, 1.4, 0, 7); g.fill(); g.globalAlpha = 1;
  }
  raf = dots.length || parts.length ? requestAnimationFrame(frame) : 0;
}
function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
const runFan = (pts, n = L.fan) => { if (M.reduced()) return 0; const dur = run(pts); dots[dots.length - 1].fan = n; return dur; };
const R = el => el.getBoundingClientRect();

// hover: a light runs through the steps bar, once per entry
document.addEventListener('mouseover', e => {
  const k = e.target.closest('.grid > .card:not(.sel)'); if (!k || k.contains(e.relatedTarget) || M.reduced()) return;
  const s = k.querySelector('.steps'); if (!s) return; const r = R(s), y = r.top + 2;
  run([[r.left, y], [r.right, y]]);
});
const hooks = {
  arrive: cards => {
    cards.forEach(k => k.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' }));
    const tabs = document.querySelector('.tabs'), on = document.querySelector('.tab.on');
    if (tabs && on) { const a = R(tabs), b = R(on); setTimeout(() => runFan([[a.left, a.bottom + 4], [b.left + b.width / 2, a.bottom + 4]]), 120); }
  },
  move: (k, dx, dy) => k.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 260, easing: M.EASE_OUT }),
  enter: k => k.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: 'ease-out' }),
  leave: gh => gh.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-in', fill: 'forwards' }).onfinish = () => gh.remove(),
  lift: l => {
    const band = l.querySelector(':scope > .top'); if (!band) return;
    const r = R(band), h = l.offsetHeight, b = band.offsetHeight, dur = run([[r.left + 6, r.bottom], [r.right - 6, r.bottom]]);
    const hold = dur / (dur + 320);   // closed while the light runs, then the card unfolds behind it
    l.animate([{ clipPath: `inset(0 -80px ${h - b}px -80px round 14px)`, offset: 0 }, { clipPath: `inset(0 -80px ${h - b}px -80px round 14px)`, offset: hold, easing: M.EASE_OUT }, { clipPath: 'inset(0 -80px -80px -80px round 14px)', offset: 1 }],
      { duration: dur + 320 });
  },
  fold: gh => gh.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-in', fill: 'forwards' }).onfinish = () => gh.remove(),
  status: k => { const b = k.querySelector('.top'); if (!b) return; const r = R(b); fan(r.left + r.width / 2, r.top + r.height / 2, 10); },
  open: k => {
    const b = k.querySelector('.top'), to = [...document.querySelectorAll('.head nav span')].find(s => s.textContent.trim() === 'Survey');
    if (!b || !to) return; const r = R(b), t = R(to);
    runFan([[r.left + 12, r.top + r.height / 2], [t.left + t.width / 2, t.bottom + 2]]);
  }
};
GALLERY_KIT.mount({
  id: 'r004-03', title: 'Lantern light',
  css: FORM_STRUCTURE.css + COLOR_BASE.css + `
  .tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .tab.on .tl-l { font-weight: 600; } .tab.on .n { color: var(--accent-ink); opacity: .75; }
  .st::before { border: 1px dashed var(--accent); } .st[data-s=decided]::before { border: 1.5px solid var(--focus); } .st[data-s=bought]::before { background: var(--accent); border-color: var(--accent); }
  .tab.on .st.dot::before { border-color: var(--accent-ink); } .tab.on .st.dot[data-s=bought]::before { background: var(--accent-ink); }
  .card .top { color: var(--accent); border-bottom-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .card:has(.pick.ready) .top { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .card.st-decided .top { background: var(--surface-2); color: var(--focus); border-bottom-color: transparent; } .card.st-decided .when { color: color-mix(in srgb, var(--focus) 70%, transparent); }
  .card.st-bought .top { background: var(--accent); color: var(--accent-ink); border-bottom-color: transparent; } .card.st-bought .when { color: color-mix(in srgb, var(--accent-ink) 75%, transparent); }
  .card.st-bought .top .st::before { background: var(--accent-ink); border-color: var(--accent-ink); }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .step i b { background: color-mix(in srgb, var(--accent) 55%, transparent); } .step.full i b { background: var(--accent); }
  .pick.ready b { color: var(--accent); }
  .lift { border-color: color-mix(in srgb, var(--accent) 50%, transparent); box-shadow: 0 0 40px 6px var(--glow-far), 0 24px 60px color-mix(in srgb, var(--code) 80%, transparent); }
  .acts .pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; } .acts .pri:hover { background: var(--focus); border-color: var(--focus); }
  .sec h3 { color: var(--accent); }
  .vt li.d::before { border: 2px solid var(--focus); background: var(--surface-2); } .vt li.b::before { background: var(--accent); border-color: var(--accent); } .vt li.u::before { border-color: var(--ink-mute); }
  .bar input:focus { border-color: var(--accent); }
`,
  render: M.wrap((el, c) => FORM_STRUCTURE.render(el, c, { unfold: 'float', thumb: 'steps' }), hooks)
});
M.controls();
</script>
<script src="../assets/backdrop.js"></script>
<script>document.dispatchEvent(new CustomEvent('lx:screen', { detail: 'gallery' }));</script>
</body>
</html>
