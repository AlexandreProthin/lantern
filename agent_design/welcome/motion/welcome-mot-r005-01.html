<script>
const NOTES=`<div><span class="label">Motion hypothesis · Still flame</span><p>A tool you open every day should not perform. On arrival the page fades in over 240 ms, and nothing travels. Hover changes colour, opacity and the thumbnail glow in 150 to 250 ms, ease-out. Suggestions fade in 40 ms apart. While Suggest is thinking, its label breathes slowly, like the header's busy pulse (RS-25). The button gives a 2% press on click, and the handoff appears at once.</p></div><div><span class="label">Input as read</span><p>The saved prompt was empty, so these are three motion languages I propose, from quiet to expressive. Everything visual is r004-01, unchanged. Type a subject and press Enter, try Suggest (and the failing Suggest), and hover the cards. With reduced motion on, nothing animates.</p></div>`;

const D=window.WELCOME_DATA;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOW=new Date(D.now);
const st={scenario:'normal',tone:D.defaultTone,toneText:'',model:D.defaultModel,modelText:'',suggest:'idle',suggestSet:-1,failNext:false,draft:''};
function scen(){return st.scenario}
function cliReady(){return scen()!=='cli'}
function libOk(){return scen()!=='library'}
function subjects(){if(scen()==='first'||scen()==='library')return [];const all=[...D.subjects].sort((a,b)=>b.lastOpened.localeCompare(a.lastOpened));return scen()==='one'?all.slice(0,1):all}
function recents(){return subjects().slice(0,3)}
function rel(iso){const d=new Date(iso);const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());const n=Math.round((day(NOW)-day(d))/864e5);if(n<=0)return'today';if(n===1)return'yesterday';if(n<7)return n+' days ago';return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function exact(iso){return new Date(iso).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}
function toneLabel(id){return (D.tones.find(t=>t.id===id)||{}).label||id}
/* WG-40: static tree layout, depth columns, leaves on rows, 16:9 box */
function thumb(s){
  const ns=s.thumb,kids={};ns.forEach(n=>{if(n.p)(kids[n.p]=kids[n.p]||[]).push(n.id)});
  const pos={};let row=0,maxD=0;
  (function walk(id,d){maxD=Math.max(maxD,d);const k=kids[id]||[];if(!k.length){pos[id]={d,r:row++};return}k.forEach(c=>walk(c,d+1));const rs=k.map(c=>pos[c].r);pos[id]={d,r:(Math.min(...rs)+Math.max(...rs))/2}})('n1',0);
  const W=160,H=90,px=10,py=8,cols=Math.max(1,maxD),rows=Math.max(1,row-1);
  const rad=Math.max(1.6,Math.min(4.5,70/Math.max(row,maxD*2)));
  const X=n=>maxD?px+pos[n].d/cols*(W-2*px):W/2,Y=n=>row>1?py+pos[n].r/rows*(H-2*py):H/2;
  let e='',c='';
  ns.forEach(n=>{if(n.p)e+=`<line x1="${X(n.p)}" y1="${Y(n.p)}" x2="${X(n.id)}" y2="${Y(n.id)}" stroke="#555" stroke-width=".6"/>`});
  ns.forEach(n=>{const x=X(n.id),y=Y(n.id);
    if(n.s==='understood')c+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="#f2f2f2"/>`;
    else if(n.s==='lit')c+=`<circle cx="${x}" cy="${y}" r="${rad+1.6}" fill="none" stroke="#888" stroke-width=".5"/><circle cx="${x}" cy="${y}" r="${rad}" fill="#101010" stroke="#f2f2f2" stroke-width=".9"/>`;
    else c+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="#101010" stroke="#aaa" stroke-width=".7" stroke-dasharray="1.2 1"/>`});
  const more=s.thumbMore?`<text x="${W-4}" y="${H-4}" text-anchor="end">+${s.thumbMore}</text>`:'';
  return `<svg class="thumb" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph of ${esc(s.title)}: ${s.understood} of ${s.total} understood">${e}${c}${more}</svg>`;
}
function progress(s){return `${s.understood} / ${s.total}`}

/* Tone controls: segmented | list | select */

  const custom=st.tone==='custom'?`<input class="custom-tone" data-tonetext maxlength="300" placeholder="Describe the tone, e.g. like a field linguist talking to an engineer" value="${esc(st.toneText)}">`:'';
  if(kind==='select')return `<select data-toneselect aria-label="Tone">${D.tones.map(t=>`<option value="${t.id}" ${t.id===st.tone?'selected':''}>${t.label}${t.id==='custom'?'…':''}</option>`).join('')}</select>`;
  if(kind==='list')return `<fieldset class="tonelist"><legend class="label">Tone</legend>${D.tones.map(t=>`<label><input type="radio" name="tone" value="${t.id}" ${t.id===st.tone?'checked':''}><span><b>${t.label}</b><small>${TONE_HINT[t.id]}</small></span></label>`).join('')}${custom}</fieldset>`;
  return `<fieldset class="tones-wrap" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:6px">Tone</legend><div class="tones">${D.tones.map(t=>`<label title="${TONE_HINT[t.id]}"><input type="radio" name="tone" value="${t.id}" ${t.id===st.tone?'checked':''}>${t.label}</label>`).join('')}</div>${custom}</fieldset>`;
}
function suggestButton(cls=''){
  const busy=st.suggest==='busy';
  return `<button class="${cls}" data-suggest ${busy||!cliReady()||!libOk()?'disabled':''} ${!cliReady()?'title="Claude CLI not ready"':''}>${busy?'Thinking of subjects…':'Suggest 3 subjects'}</button>`;
}
function suggestOutput(){
  if(st.suggest==='error')return `<p class="inline-msg" role="alert">Couldn’t get suggestions: the tutor did not answer. <button data-suggest>Retry</button></p>`;
  if(st.suggestSet<0)return '';
  return `<div class="chips" role="list" aria-label="Suggested subjects">${D.suggestions[st.suggestSet].map((c,i)=>`<button class="chipbtn" role="listitem" data-chip="${i}"><b>${esc(c.title)}</b><span>${esc(c.hook)}</span></button>`).join('')}</div>`;
}
function cliInline(){return cliReady()?'':`<p class="inline-msg" role="status">${esc(D.cliMessage).replace('Settings → Provider','<a href="#" data-settings>Settings → Provider</a>')}</p>`}
function canSubmit(){return st.draft.trim().length>0&&cliReady()&&libOk()}
function banners(){
  if(scen()==='cli')return `<div class="banner" role="status"><span class="grow">Claude Code CLI is signed out. Run <code>claude</code> once in a terminal and sign in.</span><button data-noop>Check again</button><button data-settings>Open Settings → Provider</button><button aria-label="Dismiss" data-noop>×</button></div>`;
  if(scen()==='library')return `<div class="banner" role="alert"><span class="grow">${esc(D.libraryMessage)}</span><button data-noop>Choose another folder</button><button data-noop>Retry</button><button data-noop>Create it</button><button aria-label="Dismiss" data-noop>×</button></div>`;
  return '';
}
function appbar(){
  const none=subjects().length===0;
  return `<header class="appbar"><button class="mark" title="Welcome" data-noop>◇ Lantern</button><span class="chip">Learn</span>
  <nav class="spaces" aria-label="Spaces"><button aria-current="page" title="Welcome · Ctrl+1">⌂</button><button title="Study · Ctrl+2" ${none?'disabled':''} data-go="Study">◎</button><button title="Gallery · Ctrl+3" ${none?'disabled':''} data-go="Gallery">▦</button></nav>
  <button class="gear" title="Settings" data-settings>⚙</button></header>`;
}
function handoff(title,body){const h=document.querySelector('.handoff');h.innerHTML=`<div role="dialog" aria-modal="true" aria-label="Handoff"><span class="label">Prototype handoff</span><h2>${esc(title)}</h2><p>${body}</p><button data-close>Back to Welcome</button></div>`;h.hidden=false;h.querySelector('button').focus()}
function submit(){if(!canSubmit())return;const t=st.draft.trim().slice(0,120);const tone=st.tone==='custom'?`custom (“${esc(st.toneText||'empty')}”)`:toneLabel(st.tone);const model=st.model==='custom'?`“${esc(st.modelText||'empty')}”`:(D.models.find(m=>m.id===st.model)||{}).hint;handoff('→ Study: '+t,`Creates the subject with tone <b>${tone}</b> and model <b>${model}</b>, writes its file, switches to Study and the root explanation streams in (WG-3).`)}
function proto(){
  return `<div class="proto" aria-label="Prototype controls"><span class="mono">PROTOTYPE</span><label>State <select data-scen>${D.states.map(s=>`<option value="${s.id}" ${s.id===scen()?'selected':''}>${s.label}</option>`).join('')}</select></label><label><input type="checkbox" data-fail ${st.failNext?'checked':''}> next Suggest fails</label><span>Esc clears the field · Enter submits</span><a href="../index.html">Back to proposals</a></div>`;
}
function mount(){
  document.body.innerHTML=proto()+`<div class="frame">${appbar()}${banners()}<main class="space" aria-label="Welcome">${renderSpace()}</main></div><div class="notes">${NOTES}</div><div class="handoff" hidden></div>`;
  const f=document.querySelector('[data-field]');if(f){f.value=st.draft}
}
function rerender(keepFocus=true){
  const a=document.activeElement,sel=a&&a.matches('[data-field],[data-tonetext],[data-modeltext]')?(a.matches('[data-field]')?'[data-field]':a.matches('[data-tonetext]')?'[data-tonetext]':'[data-modeltext]'):null,pos=sel?a.selectionStart:0;
  mount();
  if(sel&&keepFocus){const n=document.querySelector(sel);if(n){n.focus();n.setSelectionRange(pos,pos)}}
}
function refreshSubmit(){document.querySelectorAll('[data-submit]').forEach(b=>b.disabled=!canSubmit());if(typeof onDraft==='function')onDraft()}
document.addEventListener('input',e=>{
  if(e.target.matches('[data-field]')){st.draft=e.target.value;refreshSubmit()}
  if(e.target.matches('[data-tonetext]'))st.toneText=e.target.value;
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-scen]')){st.scenario=e.target.value;st.suggest='idle';st.suggestSet=-1;mount();document.querySelector('[data-field]')?.focus()}
  if(e.target.matches('[data-fail]'))st.failNext=e.target.checked;
  if(e.target.matches('input[name=tone]')){st.tone=e.target.value;rerender(false);document.querySelector(st.tone==='custom'?'[data-tonetext]':`input[name=tone][value=${st.tone}]`)?.focus()}
  if(e.target.matches('[data-toneselect]')){st.tone=e.target.value;rerender(false);(st.tone==='custom'?document.querySelector('[data-tonetext]'):document.querySelector('[data-toneselect]'))?.focus()}
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('[data-field]')){
    if(typeof onFieldKey==='function'&&onFieldKey(e))return;
    if(e.key==='Escape'){st.draft='';e.target.value='';refreshSubmit()}
    else if(e.key==='Enter'){e.preventDefault();submit()}
  }
  if(e.key==='Escape'&&!document.querySelector('.handoff').hidden){document.querySelector('.handoff').hidden=true;document.querySelector('[data-field]')?.focus()}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-card]');if(!t)return;
  if(t.matches('[data-suggest]')){if(st.failNext){st.suggest='busy';rerender();setTimeout(()=>{st.suggest='error';st.failNext=false;rerender()},900);return}
    st.suggest='busy';rerender();setTimeout(()=>{st.suggest='idle';st.suggestSet=(st.suggestSet+1)%D.suggestions.length;rerender();document.querySelector('[data-chip]')?.focus()},1100);return}
  if(t.matches('[data-chip]')){st.draft=D.suggestions[st.suggestSet][+t.dataset.chip].title;rerender(false);const f=document.querySelector('[data-field]');f.focus();f.setSelectionRange(f.value.length,f.value.length);return}
  if(t.matches('[data-submit]')){submit();return}
  if(t.matches('[data-open]')||t.matches('[data-card]')&&!e.target.closest('button')){const s=D.subjects.find(x=>x.id===t.dataset.open||x.id===t.dataset.card);handoff('→ Study: '+s.title,`Opens the subject in Study with its last focus restored, and moves it to the front of the recents (WG-5, WG-6).`);return}
  if(t.matches('[data-browse]')){handoff('→ Gallery',`Opens Gallery with all ${subjects().length} subjects (WG-7, same as Ctrl+3).`);return}
  if(t.matches('[data-go]')){handoff('→ '+t.dataset.go,'Header space navigation (RS-20).');return}
  if(t.matches('[data-settings]')){e.preventDefault();handoff('→ Settings','Settings → Provider (WG-13).');return}
  if(t.matches('[data-close]')){document.querySelector('.handoff').hidden=true;document.querySelector('[data-field]')?.focus();return}
});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-card]')&&(e.key==='Enter'||e.key===' ')&&e.target===document.activeElement){e.preventDefault();e.target.click()}});

function modelControl(){
  const custom=st.model==='custom'?`<input class="custom-model" data-modeltext maxlength="100" pattern="[A-Za-z0-9._:-]+" placeholder="model id, e.g. claude-sonnet-5-5" value="${esc(st.modelText)}" aria-label="Model id">`:'';
  return `<label class="model"><span class="label">Model</span><select data-modelselect>${D.models.map(m=>`<option value="${m.id}" ${m.id===st.model?'selected':''}>${m.label}${m.id===D.defaultModel?' (default)':''}</option>`).join('')}</select></label>${custom}`;
}
document.addEventListener('change',e=>{if(e.target.matches('[data-modelselect]')){st.model=e.target.value;rerender(false);(st.model==='custom'?document.querySelector('[data-modeltext]'):document.querySelector('[data-modelselect]'))?.focus()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-modeltext]'))st.modelText=e.target.value});

function appbar(){
  const none=subjects().length===0;
  return `<header class="appbar"><button class="mark" title="Welcome" data-noop>◇ Lantern</button><span class="chip">Learn</span>
  <nav class="spaces" aria-label="Spaces"><button aria-current="page" title="Welcome · Ctrl+1">⌂</button><button title="Gallery · Ctrl+3" ${none?'disabled':''} data-go="Gallery">▦</button></nav>
  <button class="gear" title="Settings" data-settings>⚙</button></header>`;
}
/* WG-40 with the room's node tokens; glow is one drop-shadow on the card's svg (WG-41) */
function thumb(s){
  const ns=s.thumb,kids={};ns.forEach(n=>{if(n.p)(kids[n.p]=kids[n.p]||[]).push(n.id)});
  const pos={};let row=0,maxD=0;
  (function walk(id,d){maxD=Math.max(maxD,d);const k=kids[id]||[];if(!k.length){pos[id]={d,r:row++};return}k.forEach(c=>walk(c,d+1));const rs=k.map(c=>pos[c].r);pos[id]={d,r:(Math.min(...rs)+Math.max(...rs))/2}})('n1',0);
  const W=160,H=90,px=10,py=8,cols=Math.max(1,maxD),rows=Math.max(1,row-1);
  const rad=Math.max(1.6,Math.min(4.5,70/Math.max(row,maxD*2)));
  const X=n=>maxD?px+pos[n].d/cols*(W-2*px):W/2,Y=n=>row>1?py+pos[n].r/rows*(H-2*py):H/2;
  let e='',c='';
  ns.forEach(n=>{if(n.p)e+=`<line x1="${X(n.p)}" y1="${Y(n.p)}" x2="${X(n.id)}" y2="${Y(n.id)}" class="t-edge"/>`});
  ns.forEach(n=>{c+=`<circle cx="${X(n.id)}" cy="${Y(n.id)}" r="${rad}" class="t-${n.s}"/>`});
  const more=s.thumbMore?`<text x="${W-4}" y="${H-4}" text-anchor="end">+${s.thumbMore}</text>`:'';
  return `<svg class="thumb" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph of ${esc(s.title)}: ${s.understood} of ${s.total} understood">${e}${c}${more}</svg>`;
}

function renderSpace(){
  const subs=subjects(),rec=recents(),first=scen()==='first';
  return `<div class="wrap ${first?'first':''}">
  ${first?`<p class="lede">${esc(D.welcomeLine)}</p>`:''}
  <div class="ask"><input data-field maxlength="120" placeholder="${esc(D.placeholder)}" aria-label="${esc(D.placeholder)}" ${libOk()?'':'disabled'} autocomplete="off"><button class="primary" data-submit ${canSubmit()?'':'disabled'}>Carry the lantern in →</button></div>
  <p class="example">${esc(D.example)}</p>
  ${cliInline()}
  <div class="row"><div class="pickers">${toneControl('segmented')}<div class="modelwrap">${modelControl()}</div></div>${suggestButton('suggest')}</div>
  ${suggestOutput()}
  ${!libOk()?`<div class="libmsg" role="status">${esc(D.libraryMessage)}<br>Recent subjects will show here once the folder is back.</div>`:''}
  ${rec.length?`<section class="shelf" aria-label="Continue"><div class="shelf-head"><span class="label">Continue</span><span class="count">${rec.length} most recent</span></div>
  <div class="cards">${rec.map(s=>`<article class="card" data-card="${s.id}" tabindex="-1"><div class="tw">${thumb(s)}</div><div class="cb"><h3 class="title-clamp" title="${esc(s.title)}">${esc(s.title)}</h3><div class="meta"><span class="prog"><b>${s.understood}</b> / ${s.total} understood</span><span class="when">${lastOpened(s)}</span></div><button class="cont" data-open="${s.id}">Continue</button></div></article>`).join('')}</div>
  <div class="browse-row"><button class="browse" data-browse>Browse all ${subs.length} →</button></div></section>`:''}
  </div>`;
}


const RM=matchMedia('(prefers-reduced-motion: reduce)');
const reduced=()=>RM.matches;
function flag(cls,ms){document.body.classList.add(cls);clearTimeout(flag[cls]);flag[cls]=setTimeout(()=>document.body.classList.remove(cls),ms)}
const baseSubmit=submit;
let submitting=false;
/* the variant may define beforeHandoff(done) to play a send-off before the handoff */
submit=function(){if(!canSubmit()||submitting)return;if(reduced()||typeof beforeHandoff!=='function'){baseSubmit();return}submitting=true;beforeHandoff(()=>{submitting=false;baseSubmit()})};
const baseRerender=rerender;
let lastSet=-1;
rerender=function(k){const fresh=st.suggestSet!==lastSet&&st.suggestSet>=0;lastSet=st.suggestSet;if(fresh)flag('fresh-chips',900);baseRerender(k);if(typeof afterRender==='function')afterRender()};


document.body.classList.add('intro');setTimeout(()=>document.body.classList.remove('intro'),400);

mount();document.querySelector('[data-field]')?.focus();
</script></body></html>
