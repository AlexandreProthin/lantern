<!doctype html>
<html lang="en" data-room="choose">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose welcome r002-03 — Glass lamp</title>
</head>
<body>
<script src="../choose-welcome-data.js"></script>
<script src="../assets/welcome-kit.js"></script>
<script src="../assets/color-base.js"></script>
<script>
WELCOME_KIT.mount({
  id: 'r002-03', title: 'Glass lamp',
  css: COLOR_BASE.css + `
  .cap { border-bottom-color: var(--line-strong); transition: border-color .2s, box-shadow .2s; }
  .cap:not(.on):focus-within { border-bottom-color: var(--accent); }
  .cap.on { background: var(--glass); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-color: var(--glass-line); }
  .cap.on.focus { border-color: color-mix(in srgb, var(--accent) 50%, transparent); box-shadow: 0 0 40px 6px var(--glow-far); }
  .subj, .dirf { caret-color: var(--accent); }
  .hair { background: var(--glass-line); }
  .cap .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 0 26px var(--glow-far); }
  .cap .primary:hover:not(:disabled) { background: var(--focus); border-color: var(--focus); }
  .tones button[aria-pressed=true] { color: var(--accent); border-radius: 0; box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  .starters button { background: var(--surface-2); border: 1px solid transparent; color: var(--node-lit); }
  .starters button:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .browse { color: var(--accent); } .browse:hover { color: var(--focus); }
`,
  render: COLOR_BASE.render,
  wire: COLOR_BASE.wire,
});
</script>
<script src="../assets/backdrop.js"></script>
<script>document.dispatchEvent(new CustomEvent('lx:screen', { detail: 'welcome' }));</script>
</body>
</html>
