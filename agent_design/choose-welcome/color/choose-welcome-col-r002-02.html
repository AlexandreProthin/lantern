<!doctype html>
<html lang="en" data-room="choose">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose welcome r002-02 — Teal needs</title>
</head>
<body>
<script src="../choose-welcome-data.js"></script>
<script src="../assets/welcome-kit.js"></script>
<script src="../assets/color-base.js"></script>
<script>
WELCOME_KIT.mount({
  id: 'r002-02', title: 'Teal needs',
  css: COLOR_BASE.css + `
  .ask::before { content: ''; position: absolute; width: min(560px, 100%); height: 240px; top: -100px; left: 50%; transform: translateX(-50%); background: radial-gradient(ellipse, var(--glow-far), transparent 70%); pointer-events: none; transition: top .38s cubic-bezier(.2,.8,.2,1); }
  .ask:has(.cap.two)::before { top: 10px; }
  .cap { border-bottom-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .cap:not(.on):focus-within { border-bottom-color: var(--accent); box-shadow: 0 6px 15px -10px var(--glow-near); }
  .cap.on { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); background: color-mix(in srgb, var(--bg) 70%, transparent); }
  .cap.two { border-color: color-mix(in srgb, var(--accent) 75%, var(--line)); box-shadow: 0 0 34px var(--glow-far); }
  .subj, .dirf { caret-color: var(--accent); }
  .hair { background: color-mix(in srgb, var(--accent) 60%, transparent); }
  .cap .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cap .primary:hover:not(:disabled) { background: var(--focus); border-color: var(--focus); }
  .tones button[aria-pressed=true] { background: var(--surface-2); color: var(--node-lit); }
  .starters .hint { color: var(--accent); }
  .starters button { background: none; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); }
  .starters button:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: var(--accent); }
  .starters button:first-of-type { background: var(--surface-2); border-color: var(--accent); color: var(--node-lit); }
  .example kbd { color: var(--accent); }
  .locale::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: 2px; }
`,
  render: COLOR_BASE.render,
  wire: COLOR_BASE.wire,
});
</script>
<script src="../assets/backdrop.js"></script>
<script>document.dispatchEvent(new CustomEvent('lx:screen', { detail: 'welcome' }));</script>
</body>
</html>
