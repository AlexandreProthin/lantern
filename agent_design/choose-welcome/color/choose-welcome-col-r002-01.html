<!doctype html>
<html lang="en" data-room="choose">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="../choose-welcome-data.js"></script>
<script src="../assets/welcome-kit.js"></script>
<script src="../assets/color-base.js"></script>
<script>
WELCOME_KIT.mount({
  id: 'r002-01', title: 'Lit question',
  css: COLOR_BASE.css + `
  .ask::before { content: ''; position: absolute; width: min(560px, 100%); height: 240px; top: -100px; left: 50%; transform: translateX(-50%); background: radial-gradient(ellipse, var(--glow-far), transparent 70%); pointer-events: none; }
  .cap { border-bottom-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .cap:not(.on):focus-within { border-bottom-color: var(--accent); box-shadow: 0 6px 15px -10px var(--glow-near); }
  .cap.on { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); background: color-mix(in srgb, var(--bg) 70%, transparent); }
  .subj, .dirf { caret-color: var(--accent); }
  .hair { background: var(--line); }
  .cap .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cap .primary:hover:not(:disabled) { background: var(--focus); border-color: var(--focus); }
  .tones button[aria-pressed=true] { background: var(--surface-2); color: var(--node-lit); }
  .starters button { background: none; border: 1px dashed var(--line); color: var(--ink-mute); }
  .starters button:hover { border-color: var(--accent); color: var(--accent); }
  .card { opacity: .7; } .card:hover, .card:focus-within, .card:focus { opacity: 1; }
`,
  render: COLOR_BASE.render,
  wire: COLOR_BASE.wire,
});
