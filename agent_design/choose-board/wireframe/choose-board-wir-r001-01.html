<!--
  id:        r001-01
  component: choose-board
  phase:     wireframe
  parents:   none
  direction: Counter rail. A 76 px rail between the graph and the reading panel (where the divider is) stacks four counters (needs, criteria, shortlist, pick), each marked when something is missing there, the status, a missing count and Recommend. Hovering a counter lists what is missing; a click opens the board in place of the graph, full height, as a two-column sheet (needs card | criteria by rank) over a shortlist row. The panel never moves.
  request:   revision 2
  inputs:    Decision board in Survey (CR-10, CR-14): a slim strip next to the graph, always visible, with a few counters and what is still missing before a decision; a click opens it full height; the reading panel stays for nodes. It collects the needs card (editable at any time, CR-31), the criteria ranked must / nice / irrelevant (CR-21, CR-23), the shortlist and the pick (CR-22), the subject status exploring / decided / bought (CR-24), and when it looks complete it offers the recommendation (CR-61; what counts as complete is decided here). Hard cases: a new subject with nothing settled, a nearly complete board, a long needs list, a chosen product, bought.
  shared:    ../assets/board-kit.js (scenarios, completeness rule, Survey frame) with ../choose-board-data.js
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose board r001-01 — Counter rail</title>
</head>
<body>
<script src="../choose-board-data.js"></script>
<script src="../assets/board-kit.js"></script>
<script>
BOARD_KIT.mount({
  id: 'r001-01', title: 'Counter rail', slot: 'rail',
  css: `
  .board { flex: 0 0 76px; border-left: 1px solid var(--hair); display: flex; flex-direction: column; min-height: 0; }
  .rail { flex: 1; display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 10px 6px; cursor: pointer; text-align: center; overflow: auto; }
  .rail:hover { background: var(--fill); }
  .rail .ttl { font-size: 10px; letter-spacing: .12em; color: var(--mute); margin-bottom: 6px; }
  .rail .ctr { position: relative; padding: 8px 2px; border-top: 1px solid var(--hair); }
  .rail .ctr b { display: block; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .rail .ctr small { display: block; font-size: 10px; color: var(--mute); }
  .rail .ctr.miss::after { content: ''; position: absolute; top: 8px; right: 6px; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--fg); }
  .rail .ctr .tip { display: none; position: absolute; right: calc(100% + 8px); top: 0; width: 220px; text-align: left; background: var(--bg); border: 1px solid var(--fg); padding: 8px 10px; z-index: 5; font-size: 12px; }
  .rail .ctr:hover .tip { display: block; }
  .rail .gap { flex: 1; min-height: 8px; }
  .rail .miss-n { font-size: 11px; color: var(--mute); padding: 6px 0; border-top: 1px solid var(--hair); }
  .rail .rec { font-size: 11px; padding: 6px 2px; } .rail .rec.on { font-weight: 600; }
  .main[data-expanded='true'] .graph { display: none; }
  .main[data-expanded='true'] .board { flex: 1 1 62%; flex-direction: column; border-left: 0; }
  .sheet { flex: 1; overflow: auto; padding: 14px 18px 70px; }
  .sheet .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--hair); }
  .sheet .top h2 { margin: 0; font-size: 15px; } .sheet .top .sp { flex: 1; }
  .missing { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; } .missing span { border: 1px dashed var(--hair); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .missing.none { color: var(--mute); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card { border: 1px solid var(--hair); padding: 12px 14px; min-width: 0; }
  .card h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); display: flex; justify-content: space-between; }
  .need { display: grid; grid-template-columns: minmax(80px, 38%) 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--fill); }
  .need .q { color: var(--mute); } .need .x { border: 0; padding: 0 4px; color: var(--faint); }
  .need.open .q { color: var(--fg); } .need.open .q::before { content: '○ '; }
  .add { margin-top: 8px; display: flex; gap: 6px; } .add input { flex: 1; }
  .grp { margin-bottom: 10px; } .grp h4 { margin: 0 0 4px; font-size: 11px; font-weight: 600; } .grp.irr { color: var(--faint); }
  .crit { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 4px 0; } .crit .why { display: block; font-size: 11px; color: var(--faint); }
  .short { margin-top: 18px; } .prods { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .prod { border: 1px solid var(--hair); padding: 10px; display: grid; gap: 6px; } .prod.chosen { border: 2px solid var(--fg); } .prod.candidate { border-style: dashed; }
  .prod .acts { display: flex; gap: 6px; flex-wrap: wrap; } .prod .acts button { font-size: 11px; }
  .rej { margin-top: 8px; font-size: 12px; color: var(--faint); }
  @media (max-width: 760px) { .board { flex: 0 0 auto !important; } .rail { flex-direction: row; overflow-x: auto; } .rail .ctr { border-top: 0; border-left: 1px solid var(--hair); min-width: 64px; } .rail .ctr .tip { display: none !important; } .cols { grid-template-columns: 1fr; } }`,
  render(el, { s, expanded, setExpanded, act, esc, counts: c, missing, stage }) {
    const by = a => missing.filter(m => m.area === a || (a === 'shortlist' && m.area === 'compare'));
    const tip = a => by(a).length ? `<div class="tip">${by(a).map(m => esc(m.text)).join('<br>')}</div>` : '';
    const ready = stage === 'ready';
    if (!expanded) {
      el.innerHTML = `<div class="rail" role="button" tabindex="0" aria-label="Open the decision board">
        <div class="ttl">BOARD</div><div><span class="st" data-s="${stage === 'open' ? 'exploring' : stage}">${stage === 'open' ? 'exploring' : stage}</span></div>
        <div class="ctr ${by('needs').length ? 'miss' : ''}"><b>${c.needsAnswered}<span class="faint">/${c.needs}</span></b><small>needs</small>${tip('needs')}</div>
        <div class="ctr ${by('criteria').length ? 'miss' : ''}"><b>${c.must}</b><small>must · ${c.nice} nice</small>${tip('criteria')}</div>
        <div class="ctr ${by('shortlist').length ? 'miss' : ''}"><b>${c.shortlisted}</b><small>shortlist</small>${tip('shortlist')}</div>
        <div class="ctr"><b>${c.chosen ? '✓' : '—'}</b><small>${c.chosen ? esc(c.chosen.name) : 'pick'}</small></div>
        <div class="gap"></div>
        <div class="miss-n">${missing.length ? missing.length + ' missing' : (c.chosen ? s.status : 'complete')}</div>
        ${s.status === 'exploring' ? `<button class="rec ${ready ? 'on' : ''}" data-rec>${ready ? 'Recommend ›' : 'Recommend'}</button>` : ''}</div>`;
      const rail = el.querySelector('.rail');
      rail.onclick = e => { if (e.target.closest('[data-rec]')) return; setExpanded(true); };
      rail.onkeydown = e => { if (e.key === 'Enter') setExpanded(true); };
      el.querySelector('[data-rec]')?.addEventListener('click', () => act.recommend());
      return;
    }
    const groups = [['must', 'Must'], ['nice', 'Nice to have'], ['open', 'To rank'], ['irrelevant', 'Irrelevant']];
    const prods = s.products.filter(p => p.state !== 'rejected'), rejected = s.products.filter(p => p.state === 'rejected');
    el.innerHTML = `<div class="sheet">
      <div class="top"><h2>Decision board</h2><span class="st" data-s="${stage === 'open' ? 'exploring' : stage}">${stage === 'open' ? 'exploring' : stage}</span><span class="sp"></span>
        ${s.status === 'exploring' ? `<button data-rec class="${ready ? 'on' : ''}">${ready ? 'Ready: get the recommendation' : `Recommend now (${missing.length} missing)`}</button>` : ''}
        <button data-close>Back to graph ✕</button></div>
      <div class="missing ${missing.length ? '' : 'none'}">${missing.length ? '<b>Still missing:</b> ' + missing.map(m => `<span>${esc(m.text)}</span>`).join('') + (s.compareGaps ? '<button data-fill>Fill Compare</button>' : '') : 'Nothing missing.'}</div>
      <div class="cols">
        <section class="card"><h3>Needs <span>${c.needsAnswered}/${c.needs}</span></h3>
          ${s.needs.length ? '' : '<p class="mute">No needs yet. The room asks as they become meaningful; you can also add one.</p>'}
          ${s.needs.map((n, i) => `<div class="need ${n.answer ? '' : 'open'}"><span class="q">${esc(n.q)}</span><input class="edit" data-n="${i}" value="${esc(n.answer || '')}" placeholder="your answer"><button class="x" data-del="${i}" title="Remove">✕</button></div>`).join('')}
          <div class="add"><input class="edit" data-add placeholder="Add a need or constraint…"><button data-addb>Add</button></div></section>
        <section class="card"><h3>Criteria <span>${c.criteria}</span></h3>
          ${s.criteria.length ? '' : '<p class="mute">No criteria yet: they appear as you explore.</p>'}
          ${groups.map(([g, l]) => { const ks = s.criteria.filter(k => k.state === g); return ks.length ? `<div class="grp ${g === 'irrelevant' ? 'irr' : ''}"><h4>${l}</h4>${ks.map(k => `<div class="crit"><span>${esc(k.name)}<span class="why">${esc(k.why)}</span></span>
            <span class="seg">${['must', 'nice', 'irrelevant'].map(x => `<button class="${k.state === x ? 'on' : ''}" data-k="${s.criteria.indexOf(k)}" data-v="${x}">${x === 'irrelevant' ? 'irr.' : x}</button>`).join('')}</span></div>`).join('')}</div>` : ''; }).join('')}</section>
      </div>
      <section class="card short"><h3>Shortlist and pick <span>${c.shortlisted} shortlisted · ${c.candidates} candidate${c.candidates === 1 ? '' : 's'}</span></h3>
        ${prods.length ? '' : '<p class="mute">No products yet. They come from the graph (families, products) and from research.</p>'}
        <div class="prods">${prods.map(p => { const i = s.products.indexOf(p); return `<div class="prod ${p.state}"><b>${esc(p.name)}</b><span class="mute">${esc(p.fact)}</span><span class="faint">${p.state}</span><div class="acts">
          ${p.state === 'candidate' ? `<button data-p="${i}" data-v="shortlisted">Shortlist</button><button data-p="${i}" data-v="rejected">Reject</button>` : ''}
          ${p.state === 'shortlisted' ? `<button data-p="${i}" data-v="chosen">Choose</button><button data-p="${i}" data-v="rejected">Reject</button>` : ''}
          ${p.state === 'chosen' && s.status !== 'bought' ? `<button class="on" data-bought>Mark as bought</button><button data-p="${i}" data-v="shortlisted">Un-choose</button>` : ''}
          ${p.state === 'chosen' && s.status === 'bought' ? '<b>Bought ✓</b>' : ''}</div></div>`; }).join('')}</div>
        ${rejected.length ? `<div class="rej">Rejected: ${rejected.map(p => `${esc(p.name)} (${esc(p.reason)})`).join(', ')}</div>` : ''}
        ${s.recommendation && s.status !== 'exploring' ? `<p class="mute" style="margin-top:12px">Recommendation: ${esc(s.recommendation)}</p>` : ''}</section>
    </div>`;
    el.querySelector('[data-close]').onclick = () => setExpanded(false);
    el.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => act.recommend());
    el.querySelector('[data-fill]')?.addEventListener('click', () => act.fillCompare());
    el.querySelectorAll('[data-n]').forEach(i => i.onchange = () => act.answer(s.needs[+i.dataset.n], i.value));
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => act.removeNeed(s.needs[+b.dataset.del]));
    const add = el.querySelector('[data-add]'); el.querySelector('[data-addb]').onclick = () => act.addNeed(add.value);
    add.onkeydown = e => { if (e.key === 'Enter') act.addNeed(add.value); };
    el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => act.rank(s.criteria[+b.dataset.k], b.dataset.v));
    el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => act.product(s.products[+b.dataset.p], b.dataset.v));
    el.querySelector('[data-bought]')?.addEventListener('click', () => act.bought());
  }
});
</script>
</body>
</html>
