# Builds the web demo (app/, `npm run build:demo`), checks it end to end, and publishes it on GitHub Pages.
# Runs on every release tag, and by hand from the Actions tab (Web demo → Run workflow).
# One-time setup: Settings → Pages → Source: GitHub Actions. Free on a public repository.
name: Web demo

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:demo
        env:
          CI: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
