<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lantern — études de mouvement</title>
<style>
:root{color-scheme:dark;--bg:#181818;--fg:#eee;--panel:#242424;--muted:#bbb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 'Segoe UI',Arial,sans-serif}main{max-width:1120px;padding:28px;margin:auto}h1{font-size:28px;margin:0 0 6px}p{margin:0 0 18px;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}.controls label{display:flex;align-items:center;gap:8px}button,select{font:inherit;color:inherit;background:#333;border:1px solid #777;border-radius:8px;padding:8px 12px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eee;outline-offset:3px}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{background:var(--panel);border-radius:12px;padding:18px;min-width:0}h2{font-size:19px;margin:0 0 4px}.stage{height:220px;display:flex;align-items:center;justify-content:center}.actor{width:180px;line-height:0}.actor svg{width:100%;height:auto}.caption{font-size:14px;color:var(--muted);min-height:42px}article button{margin-top:8px}input[type=range]{width:min(400px,80vw)}#status{min-height:24px}body.light{--bg:#fff;--fg:#181818;--panel:#eee;--muted:#555}body.light button,body.light select{background:#eee}body.light button:focus-visible{outline-color:#181818}@media(max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){main{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:24px}.stage{height:200px}}
</style></head><body><main>
<h1>Lantern — études de mouvement</h1><p>Amber ember + couches vivantes : cohérence sur les six gestes acceptés.</p>
<div class="controls"><button id="play" type="button">Lire ensemble</button><button id="pause" type="button" disabled>Pause</button><button id="stop" type="button">Interrompre</button><button id="static" type="button">Poses statiques</button><button id="hide" type="button">Masquer</button></div>
<div class="controls"><label><input id="reduced" type="checkbox">Mouvement réduit</label><label><input id="light" type="checkbox">Fond clair</label><label>Taille <select id="size"><option>32</option><option>48</option><option>64</option><option>128</option><option selected>180</option></select> px</label></div>
<div class="controls"><label for="time">Position commune</label><input id="time" type="range" min="0" max="3600" step="10" value="0"><output id="clock" for="time">0,00 s</output></div>
<p id="status" role="status" aria-live="polite">Immobile — lecture à la demande.</p><div id="grid" class="grid"></div>
<p style="margin-top:20px">Traitement et mouvements acceptés ; test de cohérence. Aucun mouvement permanent. En mode réduit, chaque geste affiche immédiatement sa pose d’arrivée.</p>
</main><script src="sources/body.js"></script><script src="sources/motion.js"></script><script src="sources/styles.js"></script><script src="sources/review.js"></script></body></html>
