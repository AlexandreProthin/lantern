[package]
name = "lantern"
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"

[lib]
name = "lantern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
tauri = { version = "=2.8.5", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tempfile = "3"
dunce = "1"
sha2 = "0.10"
tauri-plugin-updater = "=2.9.0"
# CE-11: endpoint calls from Rust; the updater already builds this reqwest with rustls, so blocking adds no HTTP or TLS stack.
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
# CE-74: wipes API keys after use; already in the tree through rustls, pinned to that version.
zeroize = "=1.9.0"
# NW-2..4: the network server. hyper, rustls (ring) and tokio-rustls are already in the tree through reqwest.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Com", "Win32_Security", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
